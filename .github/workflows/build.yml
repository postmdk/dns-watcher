name: Build OpenWrt Packages (IPK & APK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.format }} / ${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Современный формат APK под aarch64 (например, MediaTek Filogic / RAX3000M)
          - format: apk
            arch: aarch64_cortex-a53
            ver: snapshot
            
          # Классический формат IPK под mipsel (например, старые роутеры / Keenetic)
          - format: ipk
            arch: mipsel_24kc
            ver: 23.05.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          VER: ${{ matrix.ver }}
          PACKAGES: dns-watcher

      - name: Collect artifacts
        run: |
          mkdir -p output
          # Ищем собранные пакеты в зависимости от формата
          if [ "${{ matrix.format }}" = "apk" ]; then
            find bin/ -name "*.apk" -exec cp {} output/ \;
          else
            find bin/ -name "*.ipk" -exec cp {} output/ \;
          fi
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dns-watcher-${{ matrix.format }}-${{ matrix.arch }}
          path: output/*
