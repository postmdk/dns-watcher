name: Build OpenWrt Packages (IPK & APK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.format }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
          - format: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar gzip

      - name: Build IPK Package
        if: matrix.format == 'ipk'
        run: |
          mkdir -p build_ipk/CONTROL output
          
          cat << 'EOF' > build_ipk/CONTROL/control
          Package: dns-watcher
          Version: 1.0-${{ github.run_number }}
          Section: net
          Architecture: all
          Maintainer: Dmitry Morozov
          Depends: libc, ubus, jsonfilter
          Description: Event-driven DNS monitoring service for OpenWrt tunnels using procd and external hooks.
          
          EOF

          sed -i 's/\r$//' build_ipk/CONTROL/control

          if [ -d "files" ]; then
            cp -r files/* build_ipk/
          elif [ -d "etc" ] || [ -d "usr" ]; then
            [ -d "etc" ] && cp -r etc build_ipk/
            [ -d "usr" ] && cp -r usr build_ipk/
          else
            echo "Error: Source files not found!"
            exit 1
          fi

          for f in build_ipk/etc/init.d/dns-watcher build_ipk/usr/bin/dns-watcher build_ipk/etc/dns-watcher/*.sh; do
            if [ -f "$f" ]; then
              chmod +x "$f"
              sed -i 's/\r$//' "$f"
            fi
          done

          # Исправленная ссылка на рабочий скрипт opkg-build
          curl -sSL https://raw.githubusercontent.com/openwrt/opkg-utils/master/opkg-build -o opkg-build
          chmod +x opkg-build
          
          echo "=== Control file content ==="
          cat build_ipk/CONTROL/control
          
          ./opkg-build -o root -g root build_ipk/ ./output/

      - name: Build APK Package
        if: matrix.format == 'apk'
        run: |
          mkdir -p build_apk output
          
          cat << 'EOF' > build_apk/.PKGINFO
          pkgname = dns-watcher
          pkgver = 1.0-${{ github.run_number }}
          pkgdesc = Modular DNS tunnel watcher for OpenWrt
          url = https://github.com/
          arch = noarch
          maintainer = Dmitry Morozov
          license = MIT
          depend = ubus
          depend = jsonfilter
          EOF

          sed -i 's/\r$//' build_apk/.PKGINFO

          if [ -d "files" ]; then
            cp -r files/* build_apk/
          elif [ -d "etc" ] || [ -d "usr" ]; then
            [ -d "etc" ] && cp -r etc build_apk/
            [ -d "usr" ] && cp -r usr build_apk/
          fi

          for f in build_apk/etc/init.d/dns-watcher build_apk/usr/bin/dns-watcher build_apk/etc/dns-watcher/*.sh; do
            if [ -f "$f" ]; then
              chmod +x "$f"
              sed -i 's/\r$//' "$f"
            fi
          done

          cd build_apk
          tar --numeric-owner --owner=0 --group=0 -czf ../output/dns-watcher-1.0-${{ github.run_number }}_all.apk .PKGINFO etc/ usr/
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dns-watcher-${{ matrix.format }}-package
          path: output/*.*
