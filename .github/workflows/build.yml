name: Build OpenWrt Package (SDK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.format }} / ${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: apk
            arch: aarch64_cortex-a53
            ver: snapshot
          - format: ipk
            arch: mipsel_24kc
            ver: 23.05.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Official OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          VER: ${{ matrix.ver }}
          PACKAGES: dns-watcher

      - name: Prepare packages for upload
        run: |
          # Создаем уникальную подпапку для текущей архитектуры, чтобы задачи матрицы не конфликтовали
          mkdir -p compiled-packages/${{ matrix.arch }}
          
          # Рекурсивно ищем и копируем строго наш пакет dns-watcher (.ipk и .apk), исключая любые другие файлы
          find bin/packages/ -type f \( -name "dns-watcher_*.ipk" -o -name "dns-watcher_*.apk" \) -exec cp {} compiled-packages/${{ matrix.arch }}/ \;
          
          # Выводим список для проверки
          ls -la compiled-packages/${{ matrix.arch }}/

      - name: Upload artifacts (for workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages-${{ matrix.arch }}-${{ matrix.ver }}
          path: compiled-packages/${{ matrix.arch }}/*

      - name: Publish Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: compiled-packages/**/*
          files_glob: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
