name: Build OpenWrt Package (SDK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ] # Автоматически сработает при создании тега, например git tag v1.0.0 && git push --tags
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.format }} / ${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: apk
            arch: aarch64_cortex-a53
            ver: snapshot
          - format: ipk
            arch: mipsel_24kc
            ver: 23.05.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Official OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          VER: ${{ matrix.ver }}
          PACKAGES: dns-watcher

      - name: Prepare packages for upload
        run: |
          mkdir -p compiled-packages
          # Находим все собранные .ipk и .apk пакеты и копируем их в плоскую папку с понятными именами
          find bin/packages/ -name "*.ipk" -o -name "*.apk" | while read -r file; do
            cp "$file" compiled-packages/
          done
          ls -la compiled-packages/

      - name: Upload artifacts (for workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages-${{ matrix.arch }}-${{ matrix.ver }}
          path: compiled-packages/*

      - name: Publish Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: compiled-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
