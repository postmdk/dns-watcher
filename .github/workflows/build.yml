name: Build OpenWrt Package (SDK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.format }} / ${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: apk
            arch: aarch64_cortex-a53
            ver: snapshot
          - format: ipk
            arch: mipsel_24kc
            ver: 23.05.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Official OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          VER: ${{ matrix.ver }}
          PACKAGES: dns-watcher
          # Отключаем скачивание исходников для локального пакета
          # SDK будет собирать файлы напрямую из рабочей директории
