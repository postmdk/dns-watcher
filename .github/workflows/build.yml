name: Build OpenWrt Packages (IPK & APK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.format }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
          - format: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Debug repository structure
        run: |
          echo "=== Root contents ==="
          ls -la
          if [ -d "files" ]; then
            echo "=== Files directory contents ==="
            ls -la files/
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar gzip

      - name: Build IPK Package
        if: matrix.format == 'ipk'
        run: |
          mkdir -p build_ipk/CONTROL build_ipk/root output
          
          cat << 'EOF' > build_ipk/CONTROL/control
          Package: dns-watcher
          Title: Modular DNS tunnel watcher
          Version: 1.0-${{ github.run_number }}
          Section: net
          Architecture: all
          Maintainer: Dmitry Morozov
          Depends: libc, ubus, jsonfilter
          Description: Event-driven DNS monitoring service for OpenWrt tunnels using procd and external hooks.
          EOF

          # Универсальное копирование: поддерживаем и папку files/, и файлы в корне
          if [ -d "files" ]; then
            cp -r files/* build_ipk/root/
          elif [ -d "etc" ] || [ -d "usr" ]; then
            [ -d "etc" ] && cp -r etc build_ipk/root/
            [ -d "usr" ] && cp -r usr build_ipk/root/
          else
            echo "Error: Source files (etc/usr or files/) not found in repository!"
            exit 1
          fi

          # Безопасное выставление прав (только если файлы реально существуют)
          [ -f "build_ipk/root/etc/init.d/dns-watcher" ] && chmod +x build_ipk/root/etc/init.d/dns-watcher
          [ -f "build_ipk/root/usr/bin/dns-watcher" ] && chmod +x build_ipk/root/usr/bin/dns-watcher
          [ -f "build_ipk/root/etc/dns-watcher/up.sh" ] && chmod +x build_ipk/root/etc/dns-watcher/up.sh
          [ -f "build_ipk/root/etc/dns-watcher/down.sh" ] && chmod +x build_ipk/root/etc/dns-watcher/down.sh

          curl -sSL https://git.openwrt.org/project/opkg-utils.git/blob_plain/HEAD:/opkg-build -o opkg-build
          chmod +x opkg-build
          ./opkg-build -o root -g root build_ipk/ ./output/

      - name: Build APK Package
        if: matrix.format == 'apk'
        run: |
          mkdir -p build_apk output
          
          cat << 'EOF' > build_apk/.PKGINFO
          pkgname = dns-watcher
          pkgver = 1.0-${{ github.run_number }}
          pkgdesc = Modular DNS tunnel watcher for OpenWrt
          url = https://github.com/
          arch = noarch
          maintainer = Dmitry Morozov
          license = MIT
          depend = ubus
          depend = jsonfilter
          EOF

          if [ -d "files" ]; then
            cp -r files/* build_apk/
          elif [ -d "etc" ] || [ -d "usr" ]; then
            [ -d "etc" ] && cp -r etc build_apk/
            [ -d "usr" ] && cp -r usr build_apk/
          else
            echo "Error: Source files (etc/usr or files/) not found in repository!"
            exit 1
          fi

          [ -f "build_apk/etc/init.d/dns-watcher" ] && chmod +x build_apk/etc/init.d/dns-watcher
          [ -f "build_apk/usr/bin/dns-watcher" ] && chmod +x build_apk/usr/bin/dns-watcher
          [ -f "build_apk/etc/dns-watcher/up.sh" ] && chmod +x build_apk/etc/dns-watcher/up.sh
          [ -f "build_apk/etc/dns-watcher/down.sh" ] && chmod +x build_apk/etc/dns-watcher/down.sh

          cd build_apk
          tar --numeric-owner --owner=0 --group=0 -czf ../output/dns-watcher-1.0-${{ github.run_number }}_all.apk .PKGINFO etc/ usr/
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dns-watcher-${{ matrix.format }}-package
          path: output/*.*
