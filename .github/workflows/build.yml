name: Build OpenWrt Packages (IPK & APK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for SDK ${{ matrix.sdk }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Сборка под IPK (например, релиз OpenWrt 23.05)
          - sdk: x86_64-23.05
            format: ipk
          # Сборка под APK (например, транк / версия 24.10+)
          - sdk: x86_64
            format: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile OpenWrt Package using Official SDK Action
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          PACKAGES: dns-watcher

      - name: Collect and organize artifacts
        run: |
          mkdir -p output
          # Экшен складывает скомпилированные пакеты внутрь bin/packages/
          find bin/ -name "*.ipk" -o -name "*.apk" -exec cp {} output/ \;
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-package-${{ matrix.sdk }}-${{ matrix.format }}
          path: output/*
