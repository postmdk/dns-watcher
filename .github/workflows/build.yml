name: Build OpenWrt Packages (IPK & APK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_ipk:
    name: Build IPK Package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build IPK using official OpenWrt SDK container
        run: |
          mkdir -p output
          
          # Скачиваем легкий официальный SDK или используем докер-контейнер OpenWrt
          # Простейший способ через Docker-контейнер со всеми тулзами:
          docker run --rm -v ${{ github.workspace }}:/workdir -w /workdir alpine:latest sh -c "
            apk update && apk add bash make tar gzip wget python3 py3-pip
          "
          
          # Либо используем официальный экшен SDK, который не ломается, если зафиксировать окружение:
      - name: Build with OpenWrt SDK Action
        uses: openwrt/gh-action-sdk@v5
        env:
          ARCH: x86_64-23.05
          PACKAGES: dns-watcher
