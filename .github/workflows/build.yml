name: Build OpenWrt Package (SDK)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.format }} / ${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Современный APK-таргет (snapshot / актуальные ветки)
          - format: apk
            arch: aarch64_cortex-a53
            ver: snapshot
            
          # Классический IPK-таргет (стабильный релиз 23.05)
          - format: ipk
            arch: mipsel_24kc
            ver: 23.05.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Official OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          VER: ${{ matrix.ver }}
          PACKAGES: dns-watcher

      - name: Collect compiled packages
        run: |
          mkdir -p output
          # Ищем и копируем собранные пакеты независимо от подпапок SDK
          find bin/ -name "dns-watcher_*.*" -exec cp {} output/ \;
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dns-watcher-${{ matrix.format }}-${{ matrix.arch }}
          path: output/*
